# ============================================================
# Sim-to-Real Fine Tuning
# ============================================================
linear_vel_delta_bias: 0.001
angular_vel_delta_bias: 0.001
imu_install_delta_bias: 0.001

# ============================================================
# Torque Limits (扭矩限制)
# ============================================================
torque_limit: true
max_torque_joint:
  - [415, 370, 222, 415, 160, 160]
  - [415, 370, 222, 415, 160, 160]
  - [222]
  - [160, 160, 160, 160, 52]
  - [160, 160, 160, 160, 52]
  - [52, 52]

max_lower_body_torque: 1700
lower_body_joint_count: 12
transition_time: 0.1 # 全局过渡时间（可被 motion_state 的 transition_time 覆盖）
